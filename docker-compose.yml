services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakefs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakefs}
      POSTGRES_DB: ${POSTGRES_DB:-lakefs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakefs} -d ${POSTGRES_DB:-lakefs}"]
      interval: 5s
      timeout: 5s
      retries: 12

  lakefs:
    image: treeverse/lakefs:1.34
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: "postgres://${POSTGRES_USER:-lakefs}:${POSTGRES_PASSWORD:-lakefs}@postgres:5432/${POSTGRES_DB:-lakefs}?sslmode=disable"
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: ${AWS_ENDPOINT_URL}
      LAKEFS_BLOCKSTORE_S3_REGION: ${AWS_DEFAULT_REGION}
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT: ${AWS_ENDPOINT_URL}
      # Localhost-only example value. Rotate before exposing the API publicly.
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: "lakefs-on-b2-quickstart-localhost-only-do-not-reuse"
      LAKEFS_LOGGING_LEVEL: INFO
    command: ["run"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/_health"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot helper: POSTs /api/v1/setup_lakefs once lakeFS is healthy.
  # HTTP 200 (first run) and 409 (already initialized) both count as success.
  lakefs-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      lakefs:
        condition: service_healthy
    environment:
      LAKEFS_ADMIN_ACCESS_KEY_ID: ${LAKEFS_ADMIN_ACCESS_KEY_ID}
      LAKEFS_ADMIN_SECRET_ACCESS_KEY: ${LAKEFS_ADMIN_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        body=$$(printf '{"username":"admin","key":{"access_key_id":"%s","secret_access_key":"%s"}}' \
          "$$LAKEFS_ADMIN_ACCESS_KEY_ID" "$$LAKEFS_ADMIN_SECRET_ACCESS_KEY")
        code=$$(curl -sS -o /dev/null -w '%{http_code}' \
          -X POST http://lakefs:8000/api/v1/setup_lakefs \
          -H 'Content-Type: application/json' \
          -d "$$body")
        case "$$code" in
          200|409) echo "lakeFS setup OK (HTTP $$code)"; exit 0 ;;
          *) echo "lakeFS setup failed (HTTP $$code)"; exit 1 ;;
        esac
    restart: "no"

volumes:
  postgres-data:
